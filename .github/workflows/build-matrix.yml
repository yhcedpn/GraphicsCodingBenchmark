name: Build Matrix (Windows + Linux)

on:
  push:
    branches:
      - main
    paths:
      - 'OpenGL/**'
      - 'Vulkan/**'
      - 'CMakePresets.json'
      - '**/CMakeLists.txt'
      - '**/platforms.json'
      - '.github/workflows/build-matrix.yml'
  pull_request:
    paths:
      - 'OpenGL/**'
      - 'Vulkan/**'
      - 'CMakePresets.json'
      - '**/CMakeLists.txt'
      - '**/platforms.json'
      - '.github/workflows/build-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-release
            os: windows-latest
            platform_key: windows
            preset: windows-msvc-release
            build_config: Release
            shell: pwsh
          - name: linux-gcc-release
            os: ubuntu-latest
            platform_key: linux
            preset: linux-gcc-release
            build_config: ""
            shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++
          git clone --depth=1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # 通用平台筛选：每个任务目录用 platforms.json 声明可构建平台
      #（{"build_platforms": ["windows","linux"]}，缺失视为全平台支持）。
      # 平台专有实现（如 VoxelPBR 使用 windows.h / GetModuleFileNameW）只声明
      # "windows"，本矩阵会据此在 Linux 上跳过，无需逐个硬编码。
      - name: Build all tasks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Platform {
            param([string]$Manifest, [string]$Key)
            if (-not (Test-Path $Manifest)) { return $true }  # 无标记 → 全平台
            try {
              $j = Get-Content -Raw -Path $Manifest | ConvertFrom-Json
              return ($j.build_platforms -contains $Key)
            } catch {
              Write-Warning "平台标记无法解析 $Manifest，按全平台处理"
              return $true
            }
          }
          foreach ($task in Get-ChildItem -Path OpenGL -Directory) {
            if (-not (Test-Path (Join-Path $task.FullName 'CMakeLists.txt'))) {
              Write-Host "skip (no CMakeLists.txt): $($task.Name)"
              continue
            }
            $manifest = Join-Path $task.FullName 'platforms.json'
            if (-not (Test-Platform -Manifest $manifest -Key '${{ matrix.platform_key }}')) {
              Write-Host "skip (${{ matrix.platform_key }} 不在平台标记中): $($task.Name)"
              continue
            }
            Write-Host "== configure $($task.Name) =="
            cmake -S $task.FullName --preset ${{ matrix.preset }}
            if ($LASTEXITCODE -ne 0) { throw "configure failed: $($task.Name)" }
            Write-Host "== build $($task.Name) =="
            cmake --build (Join-Path $task.FullName 'out' "${{ matrix.preset }}") --config ${{ matrix.build_config }}
            if ($LASTEXITCODE -ne 0) { throw "build failed: $($task.Name)" }
          }

      - name: Build all tasks (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          set -euo pipefail
          has_platform() {
            local manifest="$1" key="$2" rc=0
            if [ -f "$manifest" ]; then
              jq -e --arg p "$key" '.build_platforms | index($p) != null' "$manifest" >/dev/null 2>&1 || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "warning: 平台标记无法解析 $manifest，按全平台处理"
                rc=0
              fi
            fi
            return "$rc"
          }
          for task in OpenGL/*/; do
            [ -f "$task/CMakeLists.txt" ] || { echo "skip (no CMakeLists.txt): $task"; continue; }
            if ! has_platform "$task/platforms.json" "${{ matrix.platform_key }}"; then
              echo "skip (${{ matrix.platform_key }} 不在平台标记中): $task"
              continue
            fi
            echo "== configure $task =="
            cmake -S "$task" --preset ${{ matrix.preset }}
            echo "== build $task =="
            cmake --build "$task/out/${{ matrix.preset }}"
          done
