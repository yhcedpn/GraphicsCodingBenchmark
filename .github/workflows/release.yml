name: Release x64 Builds

on:
  push:
    branches:
      - main
    paths:
      - 'OpenGL/**'
      - 'Vulkan/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的发布标签（例如 v1.0，仅用于初始化或补发）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect new benchmark and prepare tag
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          valid_tag() {
            [[ "$1" =~ ^v[0-9]+\.[0-9]+$ ]]
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
            valid_tag "$tag" || {
              echo "标签必须符合 v主版本.次版本，例如 v1.0"
              exit 1
            }
            git rev-parse --verify "$tag^{commit}" >/dev/null 2>&1 || {
              echo "远端不存在标签 $tag，请先创建并推送该标签"
              exit 1
            }
            {
              echo "should_release=true"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="$BEFORE"
          after="$AFTER"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before=$(git rev-list --max-parents=0 "$after")
          fi

          declare -A new_tasks=()
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            root="${path%%/*}"
            remainder="${path#*/}"
            [[ "$root" == "OpenGL" || "$root" == "Vulkan" ]] || continue
            [[ "$remainder" == */* ]] || continue
            task_name="${remainder%%/*}"
            task_dir="$root/$task_name"
            [[ -f "$task_dir/CMakeLists.txt" ]] || continue
            if ! git cat-file -e "$before:$task_dir/CMakeLists.txt" 2>/dev/null; then
              new_tasks["$task_dir"]=1
            fi
          done < <(git diff --name-only --diff-filter=A "$before" "$after" -- OpenGL Vulkan)

          if (( ${#new_tasks[@]} == 0 )); then
            echo "本次提交没有新增测评项目，不发布版本"
            {
              echo "should_release=false"
              echo "tag="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for task in "${!new_tasks[@]}"; do
            echo "检测到新增测评项目：$task"
          done

          latest=""
          while IFS= read -r candidate; do
            if valid_tag "$candidate"; then
              latest="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          if [[ -z "$latest" ]]; then
            echo "没有找到版本基线，请先创建 v1.0 标签"
            exit 1
          fi

          version="${latest#v}"
          major="${version%%.*}"
          minor="${version#*.}"
          tag="v${major}.$((minor + 1))"
          if git rev-parse --verify "$tag^{commit}" >/dev/null 2>&1; then
            echo "标签 $tag 已存在，拒绝覆盖"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$after" -m "Release $tag"
          git push origin "$tag"

          {
            echo "should_release=true"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform_key: windows
            triplet: x64-windows
            preset: windows-msvc-release
            build_config: Release
          - name: linux
            os: ubuntu-24.04
            platform_key: linux
            triplet: x64-linux
            preset: linux-gcc-release
            build_config: ''
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Cache vcpkg dependencies
        uses: actions/cache@v6
        with:
          path: .ci-cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('OpenGL/**/vcpkg.json', 'OpenGL/**/vcpkg-configuration.json', 'Vulkan/**/vcpkg.json', 'Vulkan/**/vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      # L1 缓存：已安装的 vcpkg_installed 树。命中后各任务 configure 时
      # vcpkg 只需校验 installed 状态，无需从二进制缓存重新恢复，
      # 省掉 10 次「数百小文件复制 + Defender 扫描」的 Windows 主要耗时。
      # 用 glob 匹配任务目录，新增任务无需改此步骤；key 与 L2 同源，
      # vcpkg.json / preset 变更时两层同时失效，由 L2 二进制缓存兜底重建。
      - name: Cache vcpkg installed trees
        uses: actions/cache@v6
        with:
          path: |
            OpenGL/*/vcpkg_installed/*
            Vulkan/*/vcpkg_installed/*
          key: vcpkg-installed-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('OpenGL/**/vcpkg.json', 'OpenGL/**/vcpkg-configuration.json', 'Vulkan/**/vcpkg.json', 'Vulkan/**/vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-${{ matrix.preset }}-

      - name: Configure vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "vcpkg not found: $vcpkg" }
          $cacheRoot = Join-Path $env:GITHUB_WORKSPACE '.ci-cache\vcpkg'
          $binaryCache = Join-Path $cacheRoot 'binary'
          $downloads = Join-Path $cacheRoot 'downloads'
          New-Item -ItemType Directory -Force -Path $binaryCache, $downloads | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$downloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DISABLE_METRICS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $vcpkg version

      - name: Configure vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:?VCPKG_INSTALLATION_ROOT is not set}"
          test -x "$vcpkg_root/vcpkg"
          cache_root="$GITHUB_WORKSPACE/.ci-cache/vcpkg"
          mkdir -p "$cache_root/binary" "$cache_root/downloads"
          {
            echo "VCPKG_ROOT=$vcpkg_root"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$cache_root/binary"
            echo "VCPKG_DOWNLOADS=$cache_root/downloads"
            echo "VCPKG_DISABLE_METRICS=1"
          } >> "$GITHUB_ENV"
          "$vcpkg_root/vcpkg" version

      - name: Build and package tasks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Platform {
            param([string]$Manifest, [string]$Key)
            if (-not (Test-Path $Manifest)) { return $true }
            try {
              $j = Get-Content -Raw -Path $Manifest | ConvertFrom-Json
              return ($j.build_platforms -contains $Key)
            } catch {
              Write-Warning "平台标记无法解析 $Manifest，按全平台处理"
              return $true
            }
          }
          $staging = 'staging'
          New-Item -ItemType Directory -Force $staging | Out-Null
          foreach ($root in @('OpenGL', 'Vulkan')) {
            foreach ($task in Get-ChildItem -Path $root -Directory) {
              if (-not (Test-Path (Join-Path $task.FullName 'CMakeLists.txt'))) { continue }
              $manifest = Join-Path $task.FullName 'platforms.json'
              if (-not (Test-Platform -Manifest $manifest -Key '${{ matrix.platform_key }}')) {
                Write-Host "skip (${{ matrix.platform_key }} 不在平台标记中): $($task.Name)"
                continue
              }
              Write-Host "== configure $root/$($task.Name) =="
              cmake -S $task.FullName --preset ${{ matrix.preset }}
              if ($LASTEXITCODE -ne 0) { throw "configure failed: $root/$($task.Name)" }
              Write-Host "== build $root/$($task.Name) =="
              $outDir = Join-Path $task.FullName 'out'
              $presetDir = Join-Path $outDir '${{ matrix.preset }}'
              cmake --build $presetDir --config ${{ matrix.build_config }}
              if ($LASTEXITCODE -ne 0) { throw "build failed: $root/$($task.Name)" }
              $artifactBase = "$root-$($task.Name)"
              $pkg = Join-Path $staging ($artifactBase + '-x64-win')
              New-Item -ItemType Directory -Force $pkg | Out-Null
              $binDir = Join-Path $presetDir '${{ matrix.build_config }}'
              Copy-Item (Join-Path $binDir '*.exe') $pkg
              $tripletDir = Join-Path $task.FullName 'vcpkg_installed'
              $tripletBin = Join-Path (Join-Path $tripletDir '${{ matrix.triplet }}') 'bin'
              if (Test-Path $tripletBin) { Copy-Item (Join-Path $tripletBin '*.dll') $pkg }
              if (Test-Path (Join-Path $task.FullName 'shaders')) { Copy-Item -Recurse (Join-Path $task.FullName 'shaders') $pkg }
              if (Test-Path (Join-Path $task.FullName 'materials.json')) { Copy-Item (Join-Path $task.FullName 'materials.json') $pkg }
              Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath (Join-Path $staging ($artifactBase + '-x64-win.zip')) -Force
              Remove-Item -Recurse -Force $pkg
              Write-Host "packed: $artifactBase-x64-win.zip"
            }
          }

      - name: Build and package tasks (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          has_platform() {
            local manifest="$1" key="$2" rc=0
            if [ -f "$manifest" ]; then
              jq -e --arg p "$key" '.build_platforms | index($p) != null' "$manifest" >/dev/null 2>&1 || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "warning: 平台标记无法解析 $manifest，按全平台处理"
                rc=0
              fi
            fi
            return "$rc"
          }
          staging=staging
          mkdir -p "$staging"
          for root in OpenGL Vulkan; do
            for task in "$root"/*/; do
              [ -f "$task/CMakeLists.txt" ] || continue
              if ! has_platform "$task/platforms.json" "${{ matrix.platform_key }}"; then
                echo "skip (${{ matrix.platform_key }} 不在平台标记中): $task"
                continue
              fi
              echo "== configure $task =="
              cmake -S "$task" --preset ${{ matrix.preset }}
              echo "== build $task =="
              cmake --build "$task/out/${{ matrix.preset }}"
              base="$(basename "$task")"
              artifact_base="$(basename "$root")-$base"
              pkg_dir="$staging/$artifact_base-x64-linux"
              mkdir -p "$pkg_dir"
              find "$task/out/${{ matrix.preset }}" -maxdepth 1 -type f -executable -exec cp {} "$pkg_dir/" \;
              [ -d "$task/shaders" ] && cp -r "$task/shaders" "$pkg_dir/"
              [ -f "$task/materials.json" ] && cp "$task/materials.json" "$pkg_dir/"
              tar -C "$staging" -czf "$staging/$artifact_base-x64-linux.tar.gz" "$artifact_base-x64-linux"
              rm -rf "$pkg_dir"
              echo "packed: $artifact_base-x64-linux.tar.gz"
            done
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform_key }}
          path: staging
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create and upload release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          title="RenderArena ${TAG} — OpenGL + Vulkan x64 构建"
          cat > release-notes.md <<EOF
          # RenderArena ${TAG}

          各测评项目的 x64 Release 构建产物，按 platforms.json 过滤平台适用性。

          包含：
          - OpenGL：OpenGL-<任务目录名>-x64-win.zip 或 OpenGL-<任务目录名>-x64-linux.tar.gz
          - Vulkan：Vulkan-<任务目录名>-x64-win.zip 或 Vulkan-<任务目录名>-x64-linux.tar.gz

          运行要求：
          - Windows：安装 [VC++ 2015–2022 运行库](https://aka.ms/vs/17/release/vc_redist.x64.exe)。
          - OpenGL 测评项目需要支持 OpenGL 4.6。
          - Vulkan 测评项目需要可用的 Vulkan GPU 驱动。
          - Linux：需要 X11 会话与 GPU 驱动（或 Mesa 软件渲染）；二进制由 Ubuntu 24.04 工具链构建。
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md
          fi
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
